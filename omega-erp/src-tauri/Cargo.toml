[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2.6.2" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2" }
tauri-plugin-shell = "2.2.0"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1.23.2", features = ["v4"] }
zip = "4.2.0"
walkdir = "2.5.0"
chrono = "0.4.45"
